<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Shrimp House · Admin Access</title>
<style>
:root{--bg:#10160e;--gold:#d9b96e;--cream:#f6efdf;--muted:#bdc5b2;--line:#d9b96e38}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#10160e;color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px;background-image:linear-gradient(110deg,#10160ef5,#10160edb 45%,#10160e88),url('https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=1800&q=85');background-size:cover;background-position:center}
.wrap{width:min(100%,440px)}
.brand{display:flex;align-items:center;gap:13px;margin:0 0 20px}
.logo{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#c93338,#74191e);border:1px solid #d9b96e66;color:#f2c44b;font-size:26px;box-shadow:0 10px 28px #0004}
.brand strong{letter-spacing:.1em;font-size:14px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.panel{background:#172014b8;border:1px solid var(--line);border-radius:25px;padding:clamp(22px,6vw,34px);box-shadow:0 30px 80px #0006;backdrop-filter:blur(20px)}
.kicker{font-size:11px;letter-spacing:.14em;color:var(--gold);margin-bottom:10px}
h1{margin:0 0 8px;font-size:clamp(24px,6vw,32px)}
.intro{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 24px}
label{display:block;font-size:12px;color:#e2d7bd;margin:15px 0 8px}
input{width:100%;padding:14px;border-radius:13px;border:1px solid #d9b96e32;background:#0e150de0;color:var(--cream);font:inherit;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d9b96e16}
button{width:100%;margin-top:20px;border:0;border-radius:13px;padding:14px;font:inherit;font-weight:700;color:#211c0e;background:linear-gradient(120deg,#e5c77c,#b99148);cursor:pointer}
button:hover{filter:brightness(1.06)}
.notice{margin-top:18px;border:1px solid #e0bb6930;border-radius:13px;background:#d9b96e0b;padding:13px;font-size:11px;line-height:1.8;color:#e4d5b5}
.status{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#7e412026;border:1px solid #d9b96e33;color:#f1d69a;font-size:12px;line-height:1.7}
.back{display:block;text-align:center;color:var(--muted);font-size:12px;text-decoration:none;margin-top:18px}
@media(max-width:400px){.panel{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
<header class="brand"><div class="logo" aria-hidden="true">🦐</div><div><strong>SHRIMP HOUSE</strong><small>ADMIN STUDIO · BENHA</small></div></header>
<main class="panel">
<div class="kicker">PRIVATE STAFF AREA</div>
<h1>دخول الإدارة</h1>
<p class="intro">تسجيل دخول آمن لفريق المطعم باستخدام Supabase Auth. لن يسمح بالدخول إلا لحساب موظف مسجل.</p>
<form id="loginForm">
<label for="email">البريد الإلكتروني الإداري</label>
<input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required>
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" placeholder="••••••••••" required>
<button type="submit">تسجيل الدخول</button>
</form>
<div class="status" id="status" role="status"></div>
<div class="notice">يتم التحقق من الحساب وصلاحيات الموظف من قاعدة البيانات قبل فتح لوحة الإدارة.</div>
</main>
<a class="back" href="./index.html">العودة للموقع الرئيسي</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase/config.js"></script>
<script>
(async()=>{
 const cfg=window.SHRIMP_SUPABASE_CONFIG;
 if(!cfg?.url||!cfg?.anonKey){document.getElementById('status').textContent='إعدادات اتصال قاعدة البيانات غير مكتملة.';document.getElementById('status').style.display='block';return;}
 const client=window.supabase.createClient(cfg.url,cfg.anonKey);
 document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); const status=document.getElementById('status'); status.style.display='block'; status.textContent='جارٍ التحقق من بيانات الدخول…';
  const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  if(error){status.textContent='تعذر تسجيل الدخول. راجع البريد وكلمة المرور وحاول مرة أخرى.';return;}
  const {data:profile,error:profileError}=await client.from('staff_profiles').select('role,display_name').eq('user_id',data.user.id).maybeSingle();
  if(profileError||!profile||!['admin','staff'].includes(profile.role)){await client.auth.signOut();status.textContent='الحساب صحيح، لكنه غير مسجل ضمن فريق Shrimp House. تم رفض الدخول.';return;}
  window.location.replace('./admin.html');
 });
})();
</script>
</body>
</html>
