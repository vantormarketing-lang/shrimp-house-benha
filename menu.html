<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منيو Shrimp House Benha</title><style>
:root{--olive:#202b17;--cream:#f5eedf;--gold:#d7b56c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#354425,#172012 68%);color:var(--cream);font-family:system-ui,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:0 18px}header{position:sticky;top:0;background:#172012dd;backdrop-filter:blur(15px);border-bottom:1px solid #d7b56c44;z-index:5}nav{display:flex;align-items:center;justify-content:space-between;padding:13px 0}.brand{font-weight:800}.brand small{display:block;color:var(--gold);font-weight:500}.btn{display:inline-block;border:1px solid #d7b56c;background:linear-gradient(130deg,#d7b56c,#a68742);color:#172012;border-radius:30px;padding:11px 18px;font-weight:800}.head{text-align:center;padding:32px 0 10px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800}.head h1{margin:10px 0;font-size:clamp(26px,5vw,42px)}.head p{opacity:.72}.tabs{display:flex;gap:9px;overflow:auto;padding:12px 0 18px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;color:var(--cream);background:#ffffff08;border:1px solid #d7b56c44;border-radius:24px;padding:10px 15px}.tab.active{background:linear-gradient(130deg,#d7b56c,#a68742);color:#172012}.stage{height:420px;max-width:800px;margin:auto;position:relative;perspective:1000px;overflow:hidden;touch-action:none}.wheel{position:absolute;inset:0;transform-style:preserve-3d;cursor:grab;user-select:none;touch-action:pan-y}.wheel.dragging{cursor:grabbing}.card{position:absolute;width:210px;height:310px;left:calc(50% - 105px);top:48px;border:1px solid #d7b56c55;border-radius:22px;overflow:hidden;background:#28341e;box-shadow:0 14px 30px #0007;transform-style:preserve-3d;display:flex;flex-direction:column;transition:box-shadow .15s}.card img{height:190px;width:100%;object-fit:cover;pointer-events:none}.card.no-photo{background:linear-gradient(145deg,#2a3a22,#172012)}.card.no-photo:before{content:'🍤';display:grid;place-items:center;height:100%;font-size:64px;color:#d7b56c}.card .info{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1}.card h3{margin:0;font-size:16px}.card .desc{font-size:12px;opacity:.7;line-height:1.5}.card .price{color:var(--gold);font-weight:850;margin-top:auto}.tip{text-align:center;color:#c8b991;font-size:12px;padding:4px 0 24px}.sectionDivider{border-top:1px solid #d7b56c22;margin:8px 0 24px}.foot{text-align:center;padding:20px 0 48px}.foot a{margin:8px}.status{min-height:20px;text-align:center;font-size:11px;opacity:.5}
@media(max-width:600px){.stage{height:380px}.card{width:190px;height:280px;left:calc(50% - 95px);top:50px}.card img{height:160px}.head{padding-top:22px}}
</style></head><body><header><div class="wrap"><nav><div class="brand">Shrimp House <small>BENHA • بيت الجمبري</small></div><a class="btn" href="index.html#reserve">اطلب دلوقتي</a></nav></div></header><main class="wrap"><div class="head"><div class="eyebrow">OUR MENU • FRESH SEAFOOD</div><h1>منيو Shrimp House الأصلي</h1><p>اختار القسم، واسحب بإيدك يمين أو شمال علشان تلف الأصناف</p></div><div class="tabs" id="tabs"></div><div class="stage" id="stage"><div class="wheel" id="wheel"></div></div><div class="tip">↔ اسحب الكروت بإيدك • الحركة مش تلقائية</div><div class="status" id="status"></div><div class="sectionDivider"></div><div class="foot"><a class="btn" href="index.html#reserve">اطلب أو احجز</a><a class="btn" href="index.html">العودة للرئيسية</a></div></main>
<script>
const data=[{"name":"المكرونات","items":[["المبيكة بالجمبري","150 ج.م"],["مكرونة وايت صوص جمبري","200 ج.م"],["مكرونة مشكل","200 ج.م"],["طاجن شرمب هاوس","250 ج.م"],["مكرونة ريد صوص","200 ج.م"]]},{"name":"السندوتشات","items":[["جمبري صغير","35 ج.م"],["جمبري وسط","60 ج.م"],["ساندوتش صوابع كابوريا","30 ج.م"],["ساندوتش فليه","35 ج.م"],["كفتة جمبري","40 ج.م"],["ساندوتش سيبيط","45 ج.م"],["ساندوتش مشكل","50 ج.م"]]},{"name":"الوجبات","items":[["وجبة النوفير","85 ج.م"],["وجبة المرج","130 ج.م"],["وجبة سوبر سنجاري","150 ج.م"],["وجبة شرمب هاوس","200 ج.م"],["وجبة جمبري راس ودن","150 ج.م"],["وجبة الف… (الاسم غير مكتمل)","130 ج.م"],["وجبة جمبري مشوي","150 ج.م"]]},{"name":"الأوزان","items":[["جمبري كبير","500 / 250 ج.م"],["جمبري وسط","400 / 200 ج.م"],["سيبيا","160 / 80 ج.م"],["فيليه","150 / 75 ج.م"],["كابوريا","100 ج.م"],["بلح بحر","130 ج.م"],["كابوريا علبة","230 ج.م"]]},{"name":"الشوربة","items":[["شوربة سادة جمبري","35 ج.م"],["شوربة سادة سي فود","35 ج.م"],["شوربة جمبري","80 صغير / 150 وسط ج.م"],["شوربة سي فود","80 صغير / 150 وسط ج.م"],["شوربة شرمب هاوس","200 ج.م"]]},{"name":"الأرز","items":[["أرز جمبري","70 صغير / 100 وسط / 150 كبير ج.م"],["أرز فيليه","90 صغير / 130 وسط ج.م"],["أرز كفتة","130 وسط ج.م"]]},{"name":"الإضافات","items":[["طحينة","10 ج.م"],["سلطة","15 ج.م"],["طماطم متبلة","15 ج.م"],["أرز سادة","30 ج.م"],["بطاطس","35 ج.م"],["صوص شرمب","20 ج.م"],["ليمون + شطة","15 ج.م"]]},{"name":"الصواني","items":[["صينية الكينج","300 ج.م"],["صينية الصحاب","400 ج.م"],["صينية قلب البحر","550 ج.م"],["صينية المزاج","800 ج.م"],["صينية العيلة","1000 ج.م"],["صينية اللمة","1200 ج.م"]]}];
const photoPool=["https://images.unsplash.com/photo-1559737558-2f5a35f4523a?auto=format&fit=crop&w=700&q=80","https://images.unsplash.com/photo-1534080564583-6be757c0a7e8?auto=format&fit=crop&w=700&q=80","https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&w=700&q=80","https://images.unsplash.com/photo-1565680018434-b513d5e5fd47?auto=format&fit=crop&w=700&q=80","https://images.unsplash.com/photo-1559737558-2f5a35f4523a?auto=format&fit=crop&w=700&q=80&sat=-15"];
const tabs=document.getElementById('tabs'),wheel=document.getElementById('wheel'),stage=document.getElementById('stage');
let cat=0,angle=0,drag=false,pointer=null,startX=0,lastX=0,startAngle=0;
function draw(){
 wheel.innerHTML='';
 const items=data[cat].items,n=items.length,r=Math.min(225,Math.max(170,145+n*8));
 items.forEach((it,i)=>{
  const card=document.createElement('article');card.className='card';
  const face=i*360/n;
  card.style.transform='rotateY('+face+'deg) translateZ('+r+'px)';
  const src=photoPool[(cat+i)%photoPool.length];
  const img=document.createElement('img');img.src=src;img.alt=it[0];img.loading='eager';
  img.onerror=()=>{img.remove();card.classList.add('no-photo')};
  const info=document.createElement('div');info.className='info';
  const title=document.createElement('h3');title.textContent=it[0];
  const desc=document.createElement('div');desc.className='desc';desc.textContent='من اختيارات Shrimp House';
  const price=document.createElement('div');price.className='price';price.textContent=it[1];
  info.append(title,desc,price);card.append(img,info);wheel.appendChild(card);
 });
 wheel.style.transform='rotateY('+angle+'deg)';
}
function renderTabs(){tabs.replaceChildren();data.forEach((c,i)=>{const b=document.createElement('button');b.className='tab'+(i===cat?' active':'');b.textContent=c.name;b.onclick=()=>{cat=i;angle=0;renderTabs();draw();b.scrollIntoView({block:'nearest',inline:'center'})};tabs.appendChild(b)})}
function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;drag=true;pointer=e.pointerId;startX=lastX=e.clientX;startAngle=angle;wheel.classList.add('dragging');try{stage.setPointerCapture(pointer)}catch{}}
function move(e){if(!drag||e.pointerId!==pointer)return;const delta=e.clientX-startX;angle=startAngle+delta*0.8;wheel.style.transform='rotateY('+angle+'deg)';lastX=e.clientX}
function up(e){if(!drag||e.pointerId!==pointer)return;drag=false;wheel.classList.remove('dragging');try{if(stage.hasPointerCapture(pointer))stage.releasePointerCapture(pointer)}catch{}pointer=null}
stage.addEventListener('pointerdown',down);stage.addEventListener('pointermove',move);stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);stage.addEventListener('lostpointercapture',()=>{drag=false;pointer=null;wheel.classList.remove('dragging')});
stage.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){angle-=24;wheel.style.transform='rotateY('+angle+'deg)'}else if(e.key==='ArrowRight'){angle+=24;wheel.style.transform='rotateY('+angle+'deg)'}});
stage.tabIndex=0;renderTabs();draw();
</script></body></html>
