<script>
/* محرك اللف الدائري: سحب + عجلة + كيبورد + أزرار + نقاط، ويلف دائريًا بلا نهاية. */
(function () {
  const mod = (a, b) => ((a % b) + b) % b;
  window.Ring = function (stage, opt) {
    const o = Object.assign({ w: 230, autoplay: 0 }, opt || {});
    const track = stage.querySelector('.ring-track');
    const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    const ds = getComputedStyle(stage).direction === 'rtl' ? -1 : 1;
    let cards = [], n = 0, pos = 0, target = 0, cw = o.w, raf = 0, last = 0, drag = null, sup = false, wt = 0, timer = 0, dots = [];
    const cur = () => mod(Math.round(target), n);
 
    const ui = document.createElement('div');
    ui.className = 'ring-ui'; ui.dir = 'ltr';
    const mk = (d, l) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'rbtn'; b.setAttribute('aria-label', l); b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>'; return b; };
    const bl = mk('M15 5l-7 7 7 7', 'لف يسار'), br = mk('M9 5l7 7-7 7', 'لف يمين');
    const dw = document.createElement('div'); dw.className = 'dots';
    ui.append(bl, dw, br); stage.after(ui);
 
    function size() {
      cw = Math.min(o.w, Math.max(190, stage.clientWidth * 0.7));
      stage.style.setProperty('--rw', cw + 'px');
      stage.style.perspective = cw * 3.5 + 'px';
      let h = 0; cards.forEach(c => h = Math.max(h, c.offsetHeight));
      stage.style.height = (h + 56) + 'px';
    }
    function render() {
      if (!n) return;
      const step = 2 * Math.PI / n, Rx = cw * 0.95, Rz = cw * 0.9;
      cards.forEach((c, i) => {
        const d = mod(i - pos + n / 2, n) - n / 2, f = d * step, s = Math.sin(f), co = Math.cos(f), e = (1 + co) / 2;
        c.style.transform = 'translate(-50%,-50%) translate3d(' + (ds * Rx * s).toFixed(1) + 'px,0,' + (Rz * (co - 1)).toFixed(1) + 'px) rotateY(' + (-ds * s * 24).toFixed(1) + 'deg)';
        c.style.opacity = (0.18 + 0.82 * Math.pow(e, 1.5)).toFixed(3);
        const b = Math.min(5, (1 - e) * 12);
        c.style.filter = b > 0.4 ? 'blur(' + b.toFixed(1) + 'px) brightness(' + (0.7 + 0.3 * e).toFixed(2) + ')' : 'none';
        c.style.zIndex = Math.round(e * 100);
        c.classList.toggle('front', Math.abs(d) < 0.5);
      });
    }
    function tick(t) {
      const dt = Math.min(0.05, Math.max(0.001, (t - last) / 1000)); last = t;
      if (!drag) {
        pos += (target - pos) * (1 - Math.exp(-dt / (reduce ? 0.005 : 0.09)));
        if (Math.abs(target - pos) < 0.002) { pos = target; raf = 0; render(); return; }
      }
      render(); raf = requestAnimationFrame(tick);
    }
    function mark() { const c = cur(); dots.forEach((d, i) => d.setAttribute('aria-current', i === c ? 'true' : 'false')); if (o.onChange) o.onChange(c); }
    function go(t) { target = t; mark(); if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
    function to(i) { const base = Math.round(target); go(base + mod(i - base + n / 2, n) - n / 2); }
    const stop = () => { clearInterval(timer); timer = 0; };
    const start = () => { if (o.autoplay && !reduce && !timer && n > 1) timer = setInterval(() => { if (!document.hidden && !drag) go(Math.round(target) + 1); }, o.autoplay); };
 
    bl.onclick = () => { stop(); go(Math.round(target) - ds); };
    br.onclick = () => { stop(); go(Math.round(target) + ds); };
 
    stage.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button) return;
      stop(); drag = { x: e.clientX, p: pos, moved: false, id: e.pointerId, v: 0, lx: e.clientX, lt: performance.now() };
    });
    stage.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (!drag.moved && Math.abs(dx) > 6) { drag.moved = true; stage.classList.add('drag'); try { stage.setPointerCapture(drag.id); } catch (_) {} }
      if (!drag.moved) return;
      const now = performance.now();
      drag.v = 0.7 * drag.v + 0.3 * ((e.clientX - drag.lx) / Math.max(1, now - drag.lt));
      drag.lx = e.clientX; drag.lt = now;
      pos = target = drag.p - ds * dx / (cw * 0.7);
      render();
    });
    function up() {
      if (!drag) return;
      const d = drag; drag = null; stage.classList.remove('drag');
      if (d.moved) {
        if (performance.now() - d.lt > 90) d.v = 0;
        const r = Math.round(pos);
        go(Math.max(r - 2, Math.min(r + 2, Math.round(pos - ds * d.v * 1000 / (cw * 0.7) * 0.15))));
        sup = true; setTimeout(() => sup = false, 60);
      }
      start();
    }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
    stage.addEventListener('dragstart', e => e.preventDefault());
    stage.addEventListener('click', e => {
      if (sup) { e.preventDefault(); e.stopPropagation(); return; }
      const c = e.target.closest('.ring-track>*');
      if (!c) return;
      const i = cards.indexOf(c);
      if (i > -1 && i !== cur()) { e.preventDefault(); e.stopPropagation(); stop(); to(i); }
    }, true);
    stage.addEventListener('wheel', e => {
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) || Math.abs(e.deltaX) < 4) return;
      e.preventDefault();
      const t = Date.now(); if (t - wt < 140) return; wt = t;
      stop(); go(Math.round(target) + ds * Math.sign(e.deltaX));

      const k = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (k) { e.preventDefault(); stop(); go(Math.round(target) + ds * k); }
    });
    stage.addEventListener('focusin', e => {
      const c = e.target.closest('.ring-track>*');
      if (c) { const i = cards.indexOf(c); if (i > -1 && i !== cur()) to(i); }

    const ro = new ResizeObserver(() => { size(); render(); });

      cards = [...track.children]; n = cards.length; pos = target = 0;
      dw.replaceChildren(); dots = [];
      for (let k = 0; k < n; k++) {
        const i = ds < 0 ? n - 1 - k : k, d = document.createElement('button');
        d.type = 'button'; d.className = 'dot'; d.setAttribute('aria-label', 'العنصر ' + (i + 1));
        d.onclick = () => { stop(); to(i); }; dw.appendChild(d); dots[i] = d;
      }
      ui.hidden = n < 2;
      ro.disconnect(); ro.observe(stage); cards.forEach(c => ro.observe(c));
      size(); render(); mark();
    }
    build(); start();
    return { go, to, ui, setItems(list) { track.replaceChildren(...list); build(); } };
  };
})();
</script>

  const ct = $('contact');
  if (ct) {
    const rows = [['📞', 'اتصل بنا', S.phone && 'tel:' + S.phone, S.phone], ['💬', 'واتساب', waLink('أهلاً'), S.whatsapp && 'ابدأ محادثة'],
      ['📍', 'العنوان', S.maps, S.address], ['🕐', 'مواعيد العمل', '', S.hours], ['📘', 'فيسبوك', S.facebook, S.facebook && 'صفحتنا'], ['📷', 'إنستجرام', S.instagram, S.instagram && 'حسابنا']].filter(r => r[3]);
    const box = ct.querySelector('.cgrid');
    rows.forEach(([i, t, href, txt]) => {
      const el = document.createElement(href ? 'a' : 'div'); el.className = 'glass';
      if (href) { el.href = href; el.target = '_blank'; el.rel = 'noopener'; }
      const b = document.createElement('b'); b.textContent = i + ' ' + t;
      el.append(b, document.createTextNode(txt)); box.appendChild(el);
    });
    ct.hidden = !rows.length;
  }
 
  const f = $('orderForm'); if (!f) return;
  const type = $('orderType'), addr = $('addrRow'), when = $('whenRow'), det = $('orderDetails'), msg = $('formMsg');
  const sync = () => { addr.hidden = type.value !== 'طلب دليفري'; when.hidden = type.value !== 'حجز طاولة'; };
  type.addEventListener('change', sync); sync();
  const item = new URLSearchParams(location.search).get('item');
  if (item) det.value = 'عايز أطلب: ' + item;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const phone = en($('customerPhone').value).replace(/\s|-/g, '');
    if (!/^(\+?20|0)?1[0125]\d{8}$/.test(phone)) { msg.textContent = 'من فضلك اكتب رقم موبايل مصري صحيح.'; $('customerPhone').focus(); return; }
    const lines = ['طلب/حجز جديد', 'الاسم: ' + $('customerName').value.trim(), 'الموبايل: ' + phone, 'النوع: ' + type.value];
    if (!addr.hidden && $('customerAddr').value.trim()) lines.push('العنوان: ' + $('customerAddr').value.trim());
    if (!when.hidden && $('whenAt').value.trim()) lines.push('الموعد وعدد الأفراد: ' + $('whenAt').value.trim());
    if (det.value.trim()) lines.push('التفاصيل: ' + det.value.trim());
    const url = waLink(lines.join('\n'));
    if (!url) { msg.textContent = 'الطلب الإلكتروني غير مفعّل حاليًا. من فضلك تواصل معنا مباشرة.'; return; }
    msg.textContent = 'جاري فتح واتساب…'; window.open(url, '_blank', 'noopener');
  });
})();
</script>
