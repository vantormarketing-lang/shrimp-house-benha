<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منيو Shrimp House Benha</title><style>
:root{--olive:#202b17;--cream:#f5eedf;--gold:#d7b56c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#354425,#172012 68%);color:var(--cream);font-family:system-ui,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:0 18px}header{position:sticky;top:0;background:#172012dd;backdrop-filter:blur(15px);border-bottom:1px solid #d7b56c44;z-index:5}nav{display:flex;align-items:center;justify-content:space-between;padding:13px 0}.brand{font-weight:800}.brand small{display:block;color:var(--gold);font-weight:500}.btn{display:inline-block;border:1px solid #d7b56c;background:linear-gradient(130deg,#d7b56c,#a68742);color:#172012;border-radius:30px;padding:11px 18px;font-weight:800}.head{text-align:center;padding:32px 0 10px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800}.head h1{margin:10px 0;font-size:clamp(26px,5vw,42px)}.head p{opacity:.72}.tabs{display:flex;gap:9px;overflow:auto;padding:12px 0 18px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;color:var(--cream);background:#ffffff08;border:1px solid #d7b56c44;border-radius:24px;padding:10px 15px}.tab.active{background:linear-gradient(130deg,#d7b56c,#a68742);color:#172012}.stage{height:420px;max-width:800px;margin:auto;position:relative;perspective:1000px;overflow:hidden;touch-action:pan-y}.wheel{position:absolute;inset:0;transform-style:preserve-3d;cursor:grab;user-select:none;touch-action:pan-y}.wheel.dragging{cursor:grabbing}.card{position:absolute;width:210px;height:310px;left:calc(50% - 105px);top:48px;border:1px solid #d7b56c55;border-radius:22px;overflow:hidden;background:#28341e;box-shadow:0 14px 30px #0007;transform-style:preserve-3d;display:flex;flex-direction:column;transition:box-shadow .15s}.card img{height:190px;width:100%;object-fit:cover;pointer-events:none}.card .info{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1}.card h3{margin:0;font-size:16px}.card .desc{font-size:12px;opacity:.7;line-height:1.5}.card .price{color:var(--gold);font-weight:850;margin-top:auto}.tip{text-align:center;color:#c8b991;font-size:12px;padding:4px 0 24px}.sectionDivider{border-top:1px solid #d7b56c22;margin:8px 0 24px}.foot{text-align:center;padding:20px 0 48px}.foot a{margin:8px}.status{min-height:20px;text-align:center;font-size:11px;opacity:.5}
@media(max-width:600px){.stage{height:380px}.card{width:190px;height:280px;left:calc(50% - 95px);top:50px}.card img{height:160px}.head{padding-top:22px}}
</style></head><body><header><div class="wrap"><nav><div class="brand">Shrimp House <small>BENHA • بيت الجمبري</small></div><a class="btn" href="index.html#reserve">اطلب دلوقتي</a></nav></div></header><main class="wrap"><div class="head"><div class="eyebrow">OUR MENU • FRESH SEAFOOD</div><h1>منيو Shrimp House الأصلي</h1><p>اختار القسم، واسحب بإيدك يمين أو شمال علشان تلف الأصناف</p></div><div class="tabs" id="tabs"></div><div class="stage" id="stage"><div class="wheel" id="wheel"></div></div><div class="tip">↔ اسحب الكروت بإيدك • الحركة مش تلقائية</div><div class="status" id="status"></div><div class="sectionDivider"></div><div class="foot"><a class="btn" href="index.html#reserve">اطلب أو احجز</a><a class="btn" href="index.html">العودة للرئيسية</a></div></main>
<script>
const data=[{"name":"المكرونات","items":[["المبيكة بالجمبري","150 ج.م"],["مكرونة وايت صوص جمبري","200 ج.م"],["مكرونة مشكل","200 ج.م"],["طاجن شرمب هاوس","250 ج.م"],["مكرونة ريد صوص","200 ج.م"]]},{"name":"السندوتشات","items":[["جمبري صغير","35 ج.م"],["جمبري وسط","60 ج.م"],["ساندوتش صوابع كابوريا","30 ج.م"],["ساندوتش فليه","35 ج.م"],["كفتة جمبري","40 ج.م"],["ساندوتش سيبيط","45 ج.م"],["ساندوتش مشكل","50 ج.م"]]},{"name":"الوجبات","items":[["وجبة النوفير","85 ج.م"],["وجبة المرج","130 ج.م"],["وجبة سوبر سنجاري","150 ج.م"],["وجبة شرمب هاوس","200 ج.م"],["وجبة جمبري راس ودن","150 ج.م"],["وجبة الف… (الاسم غير مكتمل)","130 ج.م"],["وجبة جمبري مشوي","150 ج.م"]]},{"name":"الأوزان","items":[["جمبري كبير","500 / 250 ج.م"],["جمبري وسط","400 / 200 ج.م"],["سيبيا","160 / 80 ج.م"],["فيليه","150 / 75 ج.م"],["كابوريا","100 ج.م"],["بلح بحر","130 ج.م"],["كابوريا علبة","230 ج.م"]]},{"name":"الشوربة","items":[["شوربة سادة جمبري","35 ج.م"],["شوربة سادة سي فود","35 ج.م"],["شوربة جمبري","80 صغير / 150 وسط ج.م"],["شوربة سي فود","80 صغير / 150 وسط ج.م"],["شوربة شرمب هاوس","200 ج.م"]]},{"name":"الأرز","items":[["أرز جمبري","70 صغير / 100 وسط / 150 كبير ج.م"],["أرز فيليه","90 صغير / 130 وسط ج.م"],["أرز كفتة","130 وسط ج.م"]]},{"name":"الإضافات","items":[["طحينة","10 ج.م"],["سلطة","15 ج.م"],["طماطم متبلة","15 ج.م"],["أرز سادة","30 ج.م"],["بطاطس","35 ج.م"],["صوص شرمب","20 ج.م"],["ليمون + شطة","15 ج.م"]]},{"name":"الصواني","items":[["صينية الكينج","300 ج.م"],["صينية الصحاب","400 ج.م"],["صينية قلب البحر","550 ج.م"],["صينية المزاج","800 ج.م"],["صينية العيلة","1000 ج.م"],["صينية اللمة","1200 ج.م"]]}];
const photoPool=["https://images.unsplash.com/photo-1559737558-2f5a35f4523a?auto=format&fit=crop&w=700&q=80","https://images.unsplash.com/photo-1534080564583-6be757c0a7e8?auto=format&fit=crop&w=700&q=80","https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&w=700&q=80","https://images.unsplash.com/photo-1565680018434-b513d5e5fd47?auto=format&fit=crop&w=700&q=80","https://images.unsplash.com/photo-1559737558-2f5a35f4523a?auto=format&fit=crop&w=700&q=80&sat=-15"];
const tabs=document.getElementById('tabs'),wheel=document.getElementById('wheel'),stage=document.getElementById('stage');
let cat=0,angle=0,dragging=false,downX=0,startAngle=0,lastX=0,lastT=0,velocity=0;
function renderTabs(){tabs.innerHTML='';data.forEach((c,i)=>{const b=document.createElement('button');b.className='tab'+(i===cat?' active':'');b.textContent=c.name;b.addEventListener('click',()=>selectCat(i));tabs.appendChild(b)})}
function draw(){wheel.innerHTML='';const items=data[cat].items,n=items.length,r=Math.min(245,Math.max(185,160+n*9));items.forEach((it,i)=>{const card=document.createElement('article');card.className='card';const base=i*360/n;card.style.transform='rotateY('+base+'deg) translateZ('+r+'px)';const photo=photoPool[(cat*2+i)%photoPool.length];card.innerHTML='<img src="'+photo+'" alt="'+it[0]+'" loading="lazy"><div class="info"><h3>'+it[0]+'</h3><div class="desc">اختيار من منيو شرمب هاوس</div><div class="price">'+it[1]+'</div></div>';wheel.appendChild(card)}wheel.style.transform='rotateY('+angle+'deg)'}
function selectCat(i){cat=i;angle=0;dragging=false;renderTabs();draw();tabs.children[i].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}
stage.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;dragging=true;downX=lastX=e.clientX;startAngle=angle;lastT=performance.now();velocity=0;wheel.classList.add('dragging');stage.setPointerCapture(e.pointerId);e.preventDefault()});
stage.addEventListener('pointermove',e=>{if(!dragging)return;const t=performance.now();angle=startAngle+(e.clientX-downX)*.75;velocity=(e.clientX-lastX)/Math.max(1,t-lastT);lastX=e.clientX;lastT=t;wheel.style.transform='rotateY('+angle+'deg)'});
function endDrag(){if(!dragging)return;dragging=false;wheel.classList.remove('dragging');angle+=Math.max(-1.5,Math.min(1.5,velocity))*65;wheel.style.transform='rotateY('+angle+'deg)'}
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);stage.addEventListener('lostpointercapture',endDrag);
stage.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){angle-=25;wheel.style.transform='rotateY('+angle+'deg)'}if(e.key==='ArrowRight'){angle+=25;wheel.style.transform='rotateY('+angle+'deg)'}});
stage.tabIndex=0;selectCat(0);
document.querySelectorAll('img').forEach(img=>{img.addEventListener('error',()=>{img.src=photoPool[0]},{once:true})});
</script></body></html>
