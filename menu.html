<title>منيو Shrimp House Benha | بيت الجمبري</title>
<meta name="description" content="منيو Shrimp House بنها بالأسعار: مكرونات، سندوتشات، وجبات، جمبري بالوزن، شوربة، أرز وصواني.">

<style>
:root{--bg:#172012;--cream:#f5eedf;--gold:#d7b56c;--gold2:#a68742;--line:#d7b56c40}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:radial-gradient(ellipse at top,#354425,var(--bg) 65%) fixed;color:var(--cream);font-family:Tajawal,"Segoe UI",system-ui,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1140px;margin:auto;padding:0 20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;top:-60px;inset-inline-start:10px;background:var(--gold);color:#172012;padding:8px 14px;border-radius:10px;z-index:20}.skip:focus{top:10px}
header{position:sticky;top:0;z-index:10;background:rgba(20,29,15,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;line-height:1.3}.brand small{display:block;color:var(--gold);font-weight:500;font-size:12px}
.logo{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,#475633,var(--bg))}
.links{display:flex;gap:20px;align-items:center}.links a{opacity:.85}.links a:hover{opacity:1;color:var(--gold)}
.btn{display:inline-block;border:1px solid var(--gold);background:linear-gradient(135deg,#d7b56c,var(--gold2));color:#172012;padding:10px 20px;border-radius:30px;font-weight:800;box-shadow:0 8px 24px #d0a95324;transition:transform .2s}.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:none}.btn.sm{padding:7px 18px;font-size:14px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:40px;padding:64px 0}
.eyebrow{color:var(--gold);letter-spacing:2px;font-size:12px;font-weight:800}
.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.15;margin:12px 0}.hero h1 span{color:var(--gold)}.hero p{font-size:18px;opacity:.82;max-width:520px}
.heroimg{height:430px;border-radius:32px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 70px #0007;background:linear-gradient(145deg,#475633,var(--bg));position:relative}
.heroimg img{width:100%;height:100%;object-fit:cover}.heroimg:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#172012aa,transparent 50%)}
section{padding:56px 0}.sectionhead{text-align:center;margin-bottom:26px}.sectionhead h2{font-size:clamp(28px,4vw,38px);margin:8px 0}.sectionhead p{opacity:.72;margin:0 0 14px}
.glass{background:rgba(255,255,255,.07);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:24px}
/* ring */
.ring{position:relative;display:block;width:100%;max-width:900px;margin:0 auto;overflow:hidden;direction:ltr;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}.ring.drag{cursor:grabbing}
.ring-track{position:absolute;inset:0;direction:ltr}.ring .ring-track>*{position:absolute!important;left:50%;top:50%;width:var(--rw,230px);direction:rtl;will-change:transform,opacity}
.ring-ui{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.rbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--cream);display:grid;place-items:center;padding:0}.rbtn:hover{background:rgba(255,255,255,.15)}
.dots{display:flex;gap:8px;align-items:center}.dot{position:relative;width:8px;height:8px;border-radius:9px;border:0;padding:0;background:#ffffff4d;transition:width .25s,background .25s}.dot:after{content:"";position:absolute;inset:-9px -4px}.dot[aria-current=true]{width:22px;background:var(--gold)}
.rcard{border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#33432a,#1d2816);box-shadow:0 16px 40px #0008;overflow:hidden;text-align:center;margin:0}
.rcard.front{border-color:var(--gold);box-shadow:0 20px 50px #000a,0 0 0 1px #d7b56c66}
.rcard .ico{font-size:54px;padding:26px 0 6px;line-height:1.2}.rcard h3{margin:0 14px 10px;font-size:19px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 12px 14px}.chip{border:1px solid var(--line);border-radius:14px;padding:2px 11px;color:var(--gold)}.chip b{font-size:18px}.chip i{font-style:normal;font-size:12px;color:var(--cream);opacity:.8}
.rcard .btn{margin:0 0 20px}
.photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;pointer-events:none;background:linear-gradient(145deg,#475633,var(--bg))}
.photo figcaption{position:absolute;inset:auto 0 0;padding:36px 16px 16px;background:linear-gradient(0deg,#111d11ee,transparent);font-weight:800}
.menu-card{overflow:hidden;min-height:300px;height:clamp(300px,42vw,420px);padding:0!important;border-radius:22px;isolation:isolate}
/* Multi-item cart */
.multi-cart{position:fixed;z-index:30;bottom:16px;inset-inline:14px;max-width:760px;margin:auto;padding:14px 16px;background:rgba(23,32,18,.94);box-shadow:0 18px 55px #0009;border-color:#d7b56c77;backdrop-filter:blur(18px);max-height:44vh;overflow:auto}
.cart-head{display:flex;justify-content:space-between;align-items:center;color:var(--gold);margin-bottom:10px}.cart-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #d7b56c22}.cart-row-name{flex:1;font-weight:700}.cart-controls{display:flex;align-items:center;gap:8px}.cart-controls button{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:#ffffff12;color:var(--cream);font-weight:800}.cart-actions{display:flex;gap:8px;margin-top:12px}.cart-actions button{flex:1}.cart-msg{font-size:13px;color:var(--gold);margin-top:7px}.menu-order{margin:0 0 14px!important}.menu-card .menu-photo{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center;z-index:-2;border:0;transition:transform .45s ease}.menu-card:hover .menu-photo{transform:scale(1.04)}.menu-card:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#07100808 18%,#07100828 42%,#071008e8 100%);z-index:-1}.menu-card-overlay{position:absolute;inset:auto 0 58px;padding:20px 16px 14px;text-align:center;color:#fff;text-shadow:0 2px 8px #0009}.menu-card-overlay h3{margin:0 0 10px;font-size:clamp(17px,3vw,22px);font-weight:800;min-height:0}.menu-card-overlay .chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0}.menu-card-overlay .chips span,.menu-card-overlay .chips b{background:#10170dc9!important;border:1px solid #d7b56c66;border-radius:14px;padding:5px 9px;color:#ffe7b3!important}.menu-card .menu-order{position:absolute;bottom:13px;left:14px;right:14px;margin:0!important;text-align:center;z-index:3}.menu-card.photo-failed{background:linear-gradient(135deg,#273522,#182112)}
/* menu page */
.head{text-align:center;padding:30px 0 6px}.head h1{margin:8px 0;font-size:clamp(28px,5vw,42px)}.head p{opacity:.75;margin:0}
.tabs{display:flex;gap:9px;overflow-x:auto;padding:12px 0;scrollbar-width:none;position:sticky;top:67px;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;color:var(--cream);background:#ffffff0d;border:1px solid var(--line);border-radius:24px;padding:8px 16px}.tab[aria-pressed=true]{background:linear-gradient(130deg,#d7b56c,var(--gold2));color:#172012;font-weight:800}
.tools{display:flex;justify-content:center;margin:6px 0}.mlist{max-width:720px;margin:10px auto 0;padding:6px 20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}.row .chips{padding:0;justify-content:flex-end}.row b.n{font-weight:700}
/* booking / contact */
.booking{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:26px}.booking h3{margin:0 0 8px}.booking form{display:grid;gap:12px}
.booking input,.booking select,.booking textarea{width:100%;padding:13px;border-radius:13px;background:#182312;border:1px solid #bda45b55;color:var(--cream);font:inherit}.booking textarea{min-height:90px}
.msg{min-height:22px;font-size:14px;color:var(--gold)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.cgrid a,.cgrid div{padding:18px;text-align:center}.cgrid b{display:block;color:var(--gold)}
footer{border-top:1px solid #d5b36a22;padding:28px 0 90px;opacity:.8;text-align:center}
.float{position:fixed;bottom:18px;inset-inline-start:18px;z-index:9;border-radius:50px;padding:12px 20px;background:var(--gold);color:#172012;font-weight:800;box-shadow:0 10px 30px #0008}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding:34px 0}.heroimg{height:290px;order:-1}.booking{grid-template-columns:1fr}.links{gap:14px;font-size:14px}.tabs{top:63px}}
@media(max-width:520px){.nav-cta,.brand small{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}

/* Graphite / Silver / Ice Blue palette — clean solid background */
:root{--bg:#17191D;--cream:#D7DCE4;--gold:#67B9E8;--gold2:#9AA7B7;--line:rgba(180,195,210,.23)}
html,body{background:#17191D!important;background-image:none!important;color:#D7DCE4!important}
body{background:#17191D!important;background-image:none!important}
header{background:rgba(23,25,29,.94)!important;border-bottom-color:rgba(180,195,210,.18)!important}
.brand small,.eyebrow,.sectionhead .eyebrow,.cgrid b,.msg,.cart-head{color:#67B9E8!important}
.links a:hover{color:#67B9E8!important}
.btn{background:linear-gradient(135deg,#D7DCE4,#9AA7B7)!important;border-color:#B8C5D3!important;color:#17191D!important;box-shadow:0 8px 24px rgba(103,185,232,.12)!important}
.btn.ghost{background:rgba(215,220,228,.06)!important;color:#D7DCE4!important;border-color:rgba(215,220,228,.28)!important}
.glass{background:rgba(42,45,51,.72)!important;border-color:rgba(180,195,210,.2)!important}
.rbtn,.tab,.cart-controls button{background:rgba(215,220,228,.07)!important;border-color:rgba(180,195,210,.25)!important;color:#D7DCE4!important}
.tab[aria-pressed=true]{background:linear-gradient(135deg,#D7DCE4,#9AA7B7)!important;color:#17191D!important}
.dot[aria-current=true]{background:#67B9E8!important}
.rcard,.menu-card,.menu-card.glass{background:#292C32!important;border-color:rgba(180,195,210,.22)!important}
.rcard.front{border-color:#67B9E8!important;box-shadow:0 20px 50px #000a,0 0 0 1px #67B9E855!important}
.chip{color:#67B9E8!important;border-color:rgba(103,185,232,.35)!important}
.multi-cart{background:rgba(29,31,35,.96)!important;border-color:rgba(103,185,232,.35)!important}
.booking input,.booking select,.booking textarea{background:#24272D!important;border-color:rgba(180,195,210,.28)!important;color:#D7DCE4!important}
.skip{background:#D7DCE4!important;color:#17191D!important}
.logo{background:#292C32!important;box-shadow:0 0 0 1px rgba(180,195,210,.2)!important}
footer{border-top-color:rgba(180,195,210,.16)!important}
.heroimg,.menu-card{border-color:rgba(180,195,210,.2)!important}

<script>
/* محرك اللف الدائري: سحب + عجلة + كيبورد + أزرار + نقاط، ويلف دائريًا بلا نهاية. */
(function () {
  const mod = (a, b) => ((a % b) + b) % b;
  window.Ring = function (stage, opt) {
    const o = Object.assign({ w: 230, autoplay: 0 }, opt || {});
    const track = stage.querySelector('.ring-track');
    const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    const ds = getComputedStyle(stage).direction === 'rtl' ? -1 : 1;
    let cards = [], n = 0, pos = 0, target = 0, cw = o.w, raf = 0, last = 0, drag = null, sup = false, wt = 0, timer = 0, dots = [];
    const cur = () => mod(Math.round(target), n);
 
    const ui = document.createElement('div');
    ui.className = 'ring-ui'; ui.dir = 'ltr';
    const mk = (d, l) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'rbtn'; b.setAttribute('aria-label', l); b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>'; return b; };
    const bl = mk('M15 5l-7 7 7 7', 'لف يسار'), br = mk('M9 5l7 7-7 7', 'لف يمين');
    const dw = document.createElement('div'); dw.className = 'dots';
    ui.append(bl, dw, br); stage.after(ui);
 
    function size() {
      cw = Math.min(o.w, Math.max(190, stage.clientWidth * 0.7));
      stage.style.setProperty('--rw', cw + 'px');
      stage.style.perspective = cw * 3.5 + 'px';
      let h = 0; cards.forEach(c => h = Math.max(h, c.offsetHeight));
      stage.style.height = (h + 56) + 'px';
    }
    function render() {
      if (!n) return;
      const step = 2 * Math.PI / n, Rx = cw * 0.95, Rz = cw * 0.9;
      cards.forEach((c, i) => {
        const d = mod(i - pos + n / 2, n) - n / 2, f = d * step, s = Math.sin(f), co = Math.cos(f), e = (1 + co) / 2;
        c.style.transform = 'translate(-50%,-50%) translate3d(' + (ds * Rx * s).toFixed(1) + 'px,0,' + (Rz * (co - 1)).toFixed(1) + 'px) rotateY(' + (-ds * s * 24).toFixed(1) + 'deg)';
        c.style.opacity = (0.18 + 0.82 * Math.pow(e, 1.5)).toFixed(3);
        const b = Math.min(5, (1 - e) * 12);
        c.style.filter = b > 0.4 ? 'blur(' + b.toFixed(1) + 'px) brightness(' + (0.7 + 0.3 * e).toFixed(2) + ')' : 'none';
        c.style.zIndex = Math.round(e * 100);
        c.classList.toggle('front', Math.abs(d) < 0.5);
      });
    }
    function tick(t) {
      const dt = Math.min(0.05, Math.max(0.001, (t - last) / 1000)); last = t;
      if (!drag) {
        pos += (target - pos) * (1 - Math.exp(-dt / (reduce ? 0.005 : 0.09)));
        if (Math.abs(target - pos) < 0.002) { pos = target; raf = 0; render(); return; }
      }
      render(); raf = requestAnimationFrame(tick);
    }
    function mark() { const c = cur(); dots.forEach((d, i) => d.setAttribute('aria-current', i === c ? 'true' : 'false')); if (o.onChange) o.onChange(c); }
    function go(t) { target = t; mark(); if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
    function to(i) { const base = Math.round(target); go(base + mod(i - base + n / 2, n) - n / 2); }
    const stop = () => { clearInterval(timer); timer = 0; };
    const start = () => { if (o.autoplay && !reduce && !timer && n > 1) timer = setInterval(() => { if (!document.hidden && !drag) go(Math.round(target) + 1); }, o.autoplay); };
 
    bl.onclick = () => { stop(); go(Math.round(target) - ds); };
    br.onclick = () => { stop(); go(Math.round(target) + ds); };
 
    stage.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button) return;
      stop(); drag = { x: e.clientX, p: pos, moved: false, id: e.pointerId, v: 0, lx: e.clientX, lt: performance.now() };
    });
    stage.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (!drag.moved && Math.abs(dx) > 6) { drag.moved = true; stage.classList.add('drag'); try { stage.setPointerCapture(drag.id); } catch (_) {} }
      if (!drag.moved) return;
      const now = performance.now();
      drag.v = 0.7 * drag.v + 0.3 * ((e.clientX - drag.lx) / Math.max(1, now - drag.lt));
